[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "regrain"
version = "0.2.0"
description = "Small, local-first media processing tools for agents and people"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
regrain = "regrain.cli:main"

[project.urls]
Repository = "https://github.com/Yang-Zhaowei/regrain"

[project.optional-dependencies]
dev = ["pytest>=8"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/regrain"]

[tool.hatch.build.targets.wheel.force-include]
"skills/regrain-speech" = "regrain/skills/regrain-speech"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-q"
markers = [
    "fast: in-process CPU correctness and immutable regression checks",
    "full: CPU process isolation, installed-wheel and optional real-torch checks",
    "gpu: explicitly configured real model integration",
]
